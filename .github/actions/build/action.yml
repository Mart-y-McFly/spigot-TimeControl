name: "Setting up JDK-Version"
description: "Sets up the JDK version (Temurin), checks Maven dependencies for updates, and runs the build."
runs:
  using: "composite"
  steps:
    - name: Set up JDK-Version
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
        cache: maven

    - name: Check for dependency updates
      run: mvn versions:display-dependency-updates versions:display-plugin-updates
      shell: bash

    - name: Prepare distribution directory
      run: |
        mkdir -p dist
        mkdir -p dist/jacoco
      shell: bash

    - name: Build Spigot
      run: |
        mvn --batch-mode clean verify -P spigot
        cp target/TimeControl-*-Spigot.jar dist/
        if [ -f target/site/jacoco/jacoco.xml ]; then cp -r target/site/jacoco/* dist/jacoco/; fi
      shell: bash

    - name: Build Paper
      run: |
        mvn --batch-mode verify -P paper
        cp target/TimeControl-*-Paper.jar dist/
        if [ -f target/site/jacoco/jacoco.xml ]; then cp -r target/site/jacoco/* dist/jacoco/; fi
      shell: bash

    - name: Build Folia
      run: |
        mvn --batch-mode verify -P folia
        cp target/TimeControl-*-Folia.jar dist/
        if [ -f target/site/jacoco/jacoco.xml ]; then cp -r target/site/jacoco/* dist/jacoco/; fi
      shell: bash

    - name: Diagnose und Restore
      run: |
        mkdir -p target/site/jacoco
        cp dist/*.jar target/
        
        echo "=== DIAGNOSE: Was wurde im target-Ordner erzeugt? ==="
        if [ -d target ]; then
          find target -maxdepth 3 || echo "Target-Inhalt konnte nicht gelistet werden"
        else
          echo "Es existiert überhaupt kein target-Ordner nach den Builds!"
        fi
        
        echo "=== DIAGNOSE: Gab es Testberichte (Surefire)? ==="
        find . -name "*surefire-report*" -o -name "TEST-*.xml" || echo "Keine Test-Ergebnisse gefunden!"
        
        # Normaler Restore-Versuch
        if [ -d dist/jacoco ] && [ "$(ls -A dist/jacoco)" ]; then
          cp -r dist/jacoco/* target/site/jacoco/
          echo "JaCoCo-Berichte erfolgreich wiederhergestellt."
        else
          echo "Info: No JaCoCo reports found."
        fi
      shell: bash
