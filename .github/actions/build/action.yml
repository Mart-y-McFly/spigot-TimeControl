name: "Setting up JDK-Version"
description: "Sets up the JDK version (Temurin), checks Maven dependencies for updates, and runs the build."
runs:
  using: "composite"
  steps:
    - name: Set up JDK-Version
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
        cache: maven

    - name: Check for dependency updates
      run: mvn versions:display-dependency-updates versions:display-plugin-updates
      shell: bash

    - name: Prepare distribution directory
      run: mkdir -p dist
      shell: bash

    - name: Build Spigot
      run: |
        mvn --batch-mode clean verify -P spigot
        cp target/TimeControl-*-Spigot.jar dist/ || echo "Spigot JAR nicht gefunden"
      shell: bash

    - name: Build Paper
      run: |
        mvn --batch-mode verify -P paper
        cp target/TimeControl-*-Paper.jar dist/ || echo "Paper JAR nicht gefunden"
      shell: bash

    - name: Build Folia
      run: |
        mvn --batch-mode verify -P folia
        cp target/TimeControl-*-Folia.jar dist/ || echo "Folia JAR nicht gefunden"
      shell: bash

    - name: Generate JaCoCo Report and Restore Target
      run: |
        echo "=== Generiere finalen JaCoCo XML-Bericht ==="
        mvn jacoco:report
        
        cp dist/*.jar target/
  
        if [ -f target/site/jacoco/jacoco.xml ]; then
          echo "Erfolg: jacoco.xml wurde erfolgreich generiert!"
        else
          echo "Fehler: jacoco.xml fehlt immer noch."
        fi
      shell: bash
